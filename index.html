<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Villámpatkányok</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>
  <div class="container">
    <div class="toast-container" id="toastContainer">
      
    </div>
    <h1>Villámpatkányok</h1>
    <form id="newRatForm" class="new-rat-form">
      <h2 class="form-title">
        Új patkány
      </h2>
      <div class="input-group">
        <label for="name">Patkány neve:</label>
        <input type="text" name="name" id="nameInput" required placeholder="Ratatouille the Flash">
      </div>
      <input type="button" id="saveRatButton" value="Mentés">
    </form>
    <div class="export-container">
      <button id="exportButton">Export</button>
      <div class="csv-szoveg" id="csvSzoveg">
        id;nev;atk;hp
      </div>
    </div>
    <div class="card-container" id="cards">

    </div>
  </div>
  <script type="module" src="./src/scripts/index.ts"></script>
</body>

</html>
